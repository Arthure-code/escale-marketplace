# Dependabot surveille les dépendances déclarées et ouvre une demande de tirage
# quand une version corrigée existe. Format décrit ici :
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Ce fichier ne couvre que les mises à jour de version. Les alertes de sécurité,
# elles, s'activent dans les réglages du dépôt, sous « Code security », et non
# ici. Les deux sont complémentaires : les alertes disent qu'une faille existe,
# ce fichier propose la montée de version qui la referme.
version: 2

updates:
  # Les paquets NuGet des deux projets. La solution est à la racine, Dependabot
  # suit donc les deux fichiers de projet qu'elle référence.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Le projet cible net8.0 et s'y tient. Les versions majeures des paquets
    # Microsoft suivent celles du cadriciel : Entity Framework Core 9 va avec
    # .NET 9, la 10 avec .NET 10. Les proposer ici n'aurait pas de sens, elles
    # ne compileraient pas, ou pire, elles compileraient et se comporteraient
    # autrement. Changer de cadriciel est une décision, pas une mise à jour.
    #
    # Les versions mineures et correctives passent toujours, et ce sont elles
    # qui portent les correctifs de sécurité, donc rien de ce que l'on attend
    # de Dependabot n'est perdu.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Les actions employées par le workflow. C'est ce qui a signalé que
  # setup-java v4 était déprécié.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
