# Squelette repris tel quel de la documentation SonarSource, page « GitHub
# Actions for SonarQube Cloud », exemple .NET :
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/ci-based-analysis/github-actions-for-sonarcloud
#
# Trois valeurs y sont des marques à remplacer, et elles seules ont été
# remplacées ici : le nom de la branche principale, la clé du projet et la clé
# de l'organisation.
#
# Deux lignes ont été ajoutées pour la couverture, l'exemple officiel n'en
# produisant pas. Leurs paramètres viennent de la page « .NET test coverage » :
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/dotnet-test-coverage
# Ce sont l'option sonar.cs.cobertura.reportsPaths passée à « begin », et
# l'étape « dotnet test » qui écrit le rapport.
#
# L'option /v: déclare la version analysée. Le projet est réglé sur « Previous
# version » : sans elle, il n'existe aucune version précédente à laquelle se
# comparer, et tout le dépôt reste éternellement compté comme du code neuf.
# Monter ce numéro au moment de publier un lot fait passer le lot précédent en
# code existant.
# https://docs.sonarsource.com/sonarqube-cloud/standards/about-new-code
#
# Un écart assumé avec l'exemple officiel : le jeton passe par un bloc « env »
# au lieu d'être développé directement dans le « run ». Développé sur place, il
# est inséré dans le script engendré avant exécution ; par « env », il reste en
# mémoire et n'entre jamais dans ce script. C'est le motif documenté par GitHub
# et exigé par la règle Sonar githubactions:S7636, que l'exemple officiel de
# SonarSource enfreint.
# https://docs.github.com/en/actions/reference/security/secure-use
name: Build
on:
  push:
    branches:
      - main # the name of your main branch
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~\.sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner
      - name: Build and analyze
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          .\.sonar\scanner\dotnet-sonarscanner begin /k:"Arthure-code_escale-marketplace" /o:"arthuredevsecops" /v:"1.0" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.cs.cobertura.reportsPaths="**/coverage.cobertura.xml"
          dotnet build
          dotnet test --no-build --collect:"XPlat Code Coverage"
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
