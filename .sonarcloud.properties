# Les migrations sont écrites par Entity Framework, pas à la main, et celle-ci
# est déjà appliquée. Une migration est un enregistrement historique qu'EF
# compare à l'instantané du modèle : la retoucher casse `dotnet ef` et
# désynchronise toute base construite à partir d'elle. Elle est donc laissée
# hors analyse plutôt que corrigée, ce qui évite qu'une remarque de style
# pousse un jour à y porter la main.
sonar.exclusions=src/Escale.Web/Repositories/Migrations/**
